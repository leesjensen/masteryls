name: CI Pipeline

on:
  push:
    branches:
      - main
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: set version
        id: set_version
        run: |
          version=$(date +'%Y%m%d.%H%M%S')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf '{"version": "%s" }' "$version" > public/version.json
          echo "Built version: $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Create config.js
        run: |
          cat > config.js << 'EOF'
          export default {
            supabase: {
              url: '${{ secrets.SUPABASE_URL }}',
              key: '${{ secrets.SUPABASE_KEY }}',
            },
            observability: {
              enabled: true,
              appName: 'masteryls',
              logs: { enabled: true },
              metrics: { enabled: true },
            },
          };
          EOF

      - name: Build
        run: |
          npm ci && npm run build
          cp dist/index.html dist/404.html

      # - name: Test
      #   run: |
      #     npm run test:edge-auth
      #     npx playwright install chromium
      #     npm run test:coverage

      - name: Save versioned site artifact
        uses: actions/upload-artifact@v6
        with:
          name: site-${{ steps.set_version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
