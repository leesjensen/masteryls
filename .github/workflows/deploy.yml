name: Deploy version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from the CI run summary (artifact name suffix)
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Find saved site artifact
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]{8}\.[0-9]{6}$ ]]; then
            echo "Version must look like YYYYMMDD.HHMMSS" >&2
            exit 1
          fi

          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=site-$VERSION" \
            --jq '.artifacts[] | select(.expired == false) | .workflow_run.id' | head -n 1)
          if [ -z "$run_id" ]; then
            echo "No unexpired site artifact found for version $VERSION" >&2
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download saved site artifact
        uses: actions/download-artifact@v8
        with:
          name: site-${{ inputs.version }}
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifact.outputs.run_id }}

      - name: Prepare GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Record deployment version
        run: echo "Deployed version: `$VERSION`" >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate deployment in Grafana
        env:
          GRAFANA_ACCESS_TOKEN: ${{ secrets.GRAFANA_ACCESS_TOKEN }}
        run: |
          curl -s -X POST https://leesjensen.grafana.net/api/annotations \
            -H "Authorization: Bearer $GRAFANA_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"dashboardUID\":\"masteryls\",\"panelId\":12,\"tags\":[\"frontend\",\"production\"],\"text\":\"Version $VERSION deployed\"}"
