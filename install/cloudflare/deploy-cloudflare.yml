# Sample workflow: deploy a saved site artifact to Cloudflare Pages.
#
# This mirrors .github/workflows/deploy.yml (same manual trigger + artifact lookup) but replaces the
# GitHub Pages steps with a Cloudflare Pages deploy. To adopt it, copy this file to
# .github/workflows/deploy-cloudflare.yml (and retire deploy.yml once the DNS cutover is done).
#
# Prerequisites (see install/cloudflare/README.md):
#   - A Cloudflare Pages project named CLOUDFLARE_PAGES_PROJECT (default: masteryls), production branch = main.
#   - Repo secrets: CLOUDFLARE_API_TOKEN (Pages:Edit), CLOUDFLARE_ACCOUNT_ID.
name: Deploy version (Cloudflare)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (YYYYMMDD.HHMMSS)
        required: true
        type: string

permissions:
  actions: read
  contents: write

env:
  CLOUDFLARE_PAGES_PROJECT: masteryls
  SITE_URL: https://masteryls.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Needed for install/cloudflare/_redirects and _headers.
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Find saved site artifact
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]{8}\.[0-9]{6}$ ]]; then
            echo "Version must look like YYYYMMDD.HHMMSS" >&2
            exit 1
          fi

          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=site-$VERSION" \
            --jq '.artifacts[] | select(.expired == false) | .workflow_run.id' | head -n 1)
          if [ -z "$run_id" ]; then
            echo "No unexpired site artifact found for version $VERSION" >&2
            exit 1
          fi

          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.head_sha')
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Download saved site artifact
        uses: actions/download-artifact@v8
        with:
          name: site-${{ inputs.version }}
          path: dist/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.artifact.outputs.run_id }}

      # The SPA 200 fallback + cache headers must live at the root of the deployed directory.
      - name: Add Cloudflare Pages config to the build
        run: cp install/cloudflare/_redirects install/cloudflare/_headers dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch=<production branch> makes this a PRODUCTION deploy (not a preview).
          command: pages deploy dist --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }} --branch=main

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.artifact.outputs.source_sha }}
          SOURCE_RUN_ID: ${{ steps.artifact.outputs.run_id }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; leaving it unchanged."
          else
            gh release create "$VERSION" \
              --target "$SOURCE_SHA" \
              --title "$VERSION" \
              --notes "Deployed to $SITE_URL. Source commit: $SOURCE_SHA. CI run: $SOURCE_RUN_ID." \
              --generate-notes
          fi

      - name: Record deployment details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.artifact.outputs.source_sha }}
        run: |
          RELEASE_URL=$(gh release view "$VERSION" --json url --jq '.url')
          {
            echo "## 🚀 Deployment succeeded"
            echo
            echo "- **Version:** $VERSION"
            echo "- **Site:** $SITE_URL"
            echo "- **GitHub release:** $RELEASE_URL"
            echo "- **Source commit:** [$SOURCE_SHA](https://github.com/$GITHUB_REPOSITORY/commit/$SOURCE_SHA)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Annotate deployment in Grafana
        env:
          GRAFANA_ACCESS_TOKEN: ${{ secrets.GRAFANA_ACCESS_TOKEN }}
        run: |
          curl -s -X POST https://leesjensen.grafana.net/api/annotations \
            -H "Authorization: Bearer $GRAFANA_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"dashboardUID\":\"masteryls\",\"panelId\":12,\"tags\":[\"frontend\",\"production\"],\"text\":\"Version $VERSION deployed\"}"
